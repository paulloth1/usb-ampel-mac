name: Build & Release

# Releases are driven by the VERSION file: bump it on main and a release
# v<VERSION> (tag + macOS .app zip + Fedora .rpm) is created automatically.
# If the release already exists, its assets are replaced.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"
          fi

  macos:
    needs: version
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build app
        run: |
          chmod +x scripts/build-app.sh
          scripts/build-app.sh "${{ needs.version.outputs.version }}"
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: build/USB-Ampel-*.zip

  fedora:
    needs: version
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: dnf install -y rpm-build systemd-rpm-macros desktop-file-utils
      - name: Build RPM
        run: |
          rpmbuild -bb linux/usb-ampel.spec \
            --define "ver ${{ needs.version.outputs.version }}" \
            --define "_sourcedir $PWD/linux" \
            --define "_rpmdir $PWD/build"
          ls -l build/noarch
      - name: Test-install RPM
        run: |
          dnf install -y build/noarch/usb-ampel-*.rpm
          usb-ampel --version
          python3 -c "import gi; gi.require_version('Gtk','4.0'); gi.require_version('Adw','1'); from gi.repository import Gtk, Adw; import cairo; print('GTK', Gtk.get_major_version(), Gtk.get_minor_version())"
          set +e; usb-ampel red on; rc=$?; set -e
          test "$rc" = 1   # no device in CI -> "not found"
      - uses: actions/upload-artifact@v4
        with:
          name: fedora
          path: build/noarch/usb-ampel-*.rpm

  release:
    needs: [version, macos, fedora]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ needs.version.outputs.version }}
        run: |
          ls -l dist
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* -R "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" dist/* -R "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "USB-Ampel $TAG" \
              --generate-notes
          fi
