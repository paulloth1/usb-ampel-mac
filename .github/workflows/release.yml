name: Build & Release

# Releases are driven by the VERSION file: bump it on main and a release
# v<VERSION> (tag + .app zip) is created automatically if it doesn't exist yet.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Determine version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(tr -d '[:space:]' < VERSION)"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "TAG=v$VERSION" >> "$GITHUB_ENV"

      - name: Build app
        run: |
          chmod +x scripts/build-app.sh
          scripts/build-app.sh "$VERSION"

      - uses: actions/upload-artifact@v4
        with:
          name: USB-Ampel-${{ env.VERSION }}
          path: build/USB-Ampel-*.zip

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists – updating asset"
            gh release upload "$TAG" build/USB-Ampel-*.zip --clobber
          else
            gh release create "$TAG" build/USB-Ampel-*.zip \
              --target "$GITHUB_SHA" \
              --title "USB-Ampel $TAG" \
              --generate-notes
          fi
